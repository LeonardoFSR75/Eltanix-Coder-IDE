# Catálogo declarativo de modelos.
#
# Cada entrada vira uma rota no litellm.Router. `id` é o nome público exposto em
# GET /v1/models; `provider` seleciona o adaptador em router/adapters/.
#
# Variáveis no formato ${VAR} são resolvidas a partir do ambiente na carga.
# Uma entrada cujo segredo obrigatório esteja ausente é marcada como indisponível
# (não derruba a inicialização) e some das rotas até a credencial existir.

providers:
  # ── Local ────────────────────────────────────────────────────────────────
  - id: ollama/qwen2.5-coder:7b
    provider: ollama
    model: qwen2.5-coder:7b
    context_window: 32768
    tags: [local, coding, fast]
    capabilities: [chat, tools]

  - id: ollama/qwen2.5-coder:1.5b
    provider: ollama
    model: qwen2.5-coder:1.5b
    context_window: 32768
    tags: [local, tiny, fast, utility]
    capabilities: [chat]

  # `embedding_dim` é obrigatório em todo modelo de embedding: a coluna
  # pgvector tem dimensão fixa (EMBEDDING_DIM), e `router/catalog.py::
  # validate_catalog` desabilita na carga quem não bater — antes que o vetor
  # errado entre no índice.
  # `embedding_prefixes` só entra em vigor com EMBEDDING_PREFIXES_ENABLED=true.
  # O nomic foi treinado com objetivo assimétrico: consulta e documento levam
  # instruções diferentes. Sem prefixo o modelo roda fora do regime de treino —
  # mas ligá-los muda o espaço vetorial, então a etiqueta de proveniência vira
  # `ollama/nomic-embed-text#prefixed` e o índice antigo precisa ser refeito.
  - id: ollama/nomic-embed-text
    provider: ollama
    model: nomic-embed-text
    context_window: 8192
    embedding_dim: 768
    embedding_prefixes:
      query: "search_query: "
      document: "search_document: "
    tags: [local, embedding]
    capabilities: [embedding]

  # ── Azure AI Foundry ─────────────────────────────────────────────────────
  # Deployment gerenciado (Azure OpenAI): `deployment` é o nome do deployment,
  # não o nome do modelo.
  - id: foundry/gpt-4o
    provider: azure_foundry
    mode: managed
    deployment: gpt-4o
    context_window: 128000
    tags: [cloud, coding, strong]
    capabilities: [chat, tools, vision, prompt_cache]

  - id: foundry/gpt-4o-mini
    provider: azure_foundry
    mode: managed
    deployment: gpt-4o-mini
    context_window: 128000
    tags: [cloud, cheap, fast, utility]
    capabilities: [chat, tools, prompt_cache]

  # Endpoint serverless (MaaS): `model` é o nome do modelo no catálogo Foundry.
  - id: foundry/llama-3.3-70b
    provider: azure_foundry
    mode: serverless
    model: Llama-3.3-70B-Instruct
    context_window: 128000
    tags: [cloud, coding]
    capabilities: [chat, tools]
    enabled: false

  # ── Databricks Model Serving ─────────────────────────────────────────────
  - id: databricks/llama-3.3-70b
    provider: databricks
    endpoint: databricks-meta-llama-3-3-70b-instruct
    context_window: 128000
    tags: [cloud, coding]
    capabilities: [chat, tools]
    enabled: true

  # bge-large-en devolve 1024 dimensões. Com o EMBEDDING_DIM padrão (768, do
  # nomic) `validate_catalog` desabilita este modelo na carga e o perfil
  # `embedding` cai para o Ollama — que é o comportamento correto, não uma
  # regressão. Para usá-lo de fato: EMBEDDING_DIM=1024 + migração das colunas
  # `Vector(...)` e reindexação completa (o espaço vetorial muda).
  - id: databricks/bge-large-en
    provider: databricks
    endpoint: databricks-bge-large-en
    context_window: 512
    embedding_dim: 1024
    # BGE instrui só o lado da consulta — o documento vai cru. Assimetria de um
    # lado só é assimetria igual; deixar `document` de fora é o correto aqui.
    embedding_prefixes:
      query: "Represent this sentence for searching relevant passages: "
    tags: [cloud, embedding]
    capabilities: [embedding]
    enabled: true

  # ── Provedores diretos (comparação de qualidade/custo) ───────────────────
  - id: anthropic/claude-sonnet-4-5
    provider: anthropic
    model: claude-sonnet-4-5
    context_window: 200000
    tags: [cloud, coding, strong]
    capabilities: [chat, tools, vision, prompt_cache]
    enabled: true

  - id: openai/gpt-4o-mini
    provider: openai
    model: gpt-4o-mini
    context_window: 128000
    tags: [cloud, cheap, fast]
    capabilities: [chat, tools, prompt_cache]
    enabled: false
