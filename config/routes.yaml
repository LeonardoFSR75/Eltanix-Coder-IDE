# Perfis de roteamento. O cliente pede um perfil no campo `model`
# (ex.: "auto/cheap") ou um id concreto do providers.yaml (ex.: "foundry/gpt-4o").
#
# strategy:
#   priority     ordem literal da lista `models`
#   cost         menor custo estimado do request primeiro
#   latency      menor latência p95 observada primeiro
#   score        combinação ponderada (ver `weights`)
#
# `models` também aceita o fallback: quando o primeiro candidato falha ou o
# contexto não cabe na janela, o próximo assume.
#
# Foco atual do projeto é usar Databricks Model Serving como motor principal
# (ver `databricks-first` abaixo) — por isso ele também aparece cedo nas
# listas dos outros perfis, como fallback preferencial sobre Anthropic/Groq/
# Foundry. Isso só muda a ORDEM de tentativa em `priority`/`score`; `cheap` e
# `fast` continuam escolhendo por custo/latência medidos, não por posição na
# lista (ver nota em cada um).

default_profile: databricks-first

profiles:
  # O "formato padrão Databricks": prioridade estrita no motor Databricks,
  # com fallback para os provedores diretos só se ele estiver indisponível
  # (sem credencial, contexto estourado ou circuito aberto — ver
  # `router/policy.py::_build_candidate`). Copiar este bloco é o jeito
  # padronizado de declarar "Databricks primeiro" pra um perfil novo.
  databricks-first:
    strategy: priority
    models:
      - databricks/llama-3.3-70b
      - anthropic/claude-sonnet-4-6
      - groq/llama-3.3-70b-versatile
      - foundry/gpt-4o

  # Perfil padrão de quem não escolheu nada explicitamente. Pondera saúde,
  # custo, latência e sucesso — Databricks vem primeiro na lista como
  # desempate (`score` só usa a ordem quando o cálculo empata, ver
  # `RoutingPolicy._order_by_score`), não como prioridade garantida.
  auto:
    strategy: score
    weights:
      health: 0.3
      cost: 0.25
      latency: 0.2
      success_rate: 0.15
      context_fit: 0.1
    models:
      - databricks/llama-3.3-70b
      - anthropic/claude-haiku-4-5-20251001
      - anthropic/claude-sonnet-4-6
      - groq/llama-3.3-70b-versatile
      - foundry/gpt-4o-mini
      - groq/llama-3.1-8b-instant
      - ollama/qwen2.5-coder:1.5b

  # O modelo local aqui é o pequeno, de propósito. Sem GPU, o 7b só é
  # utilizável se o Docker tiver RAM sobrando.
  #
  # Databricks continua fallback aqui, mas DEPOIS do Ollama local — colocá-lo
  # antes contradiria o próprio propósito do perfil (e quebraria
  # `test_policy.py::test_local_first_prefers_ollama`, que protege essa
  # garantia). "Privilegiar Databricks" vale para os perfis de nuvem; aqui o
  # que se privilegia é não pagar/depender de rede quando o modelo local cabe.
  local-first:
    strategy: priority
    models:
      - ollama/qwen2.5-coder:7b
      - ollama/qwen2.5-coder:1.5b
      - databricks/llama-3.3-70b
      - anthropic/claude-haiku-4-5-20251001
      - foundry/gpt-4o-mini

  # Tarefas de codificação de verdade — é o perfil padrão do modo Agente
  # quando nenhum modelo é escolhido na IDE (ver
  # `agent/api/routes/agent.py::_session_view`), então é o que mais importa
  # pro foco em Databricks primeiro no dia a dia.
  coding:
    strategy: priority
    models:
      - databricks/llama-3.3-70b
      - anthropic/claude-sonnet-4-6
      - groq/llama-3.3-70b-versatile
      - foundry/gpt-4o
      - ollama/qwen2.5-coder:7b

  # `cost` ordena pelo valor estimado de cada candidato, não pela posição
  # aqui — Databricks só vem cedo na lista por legibilidade/documentação do
  # que se prefere em caso de empate de custo.
  cheap:
    strategy: cost
    models:
      - groq/llama-3.1-8b-instant
      - databricks/llama-3.3-70b
      - anthropic/claude-haiku-4-5-20251001
      - foundry/gpt-4o-mini
      - openai/gpt-4o-mini
      - ollama/qwen2.5-coder:1.5b

  # `latency` ordena pelo p95 medido, não pela posição aqui — mesma ressalva
  # do `cheap` acima.
  fast:
    strategy: latency
    models:
      - groq/llama-3.1-8b-instant
      - groq/llama-3.3-70b-versatile
      - databricks/llama-3.3-70b
      - anthropic/claude-haiku-4-5-20251001
      - foundry/gpt-4o-mini
      - ollama/qwen2.5-coder:1.5b

  # Autocompletar inline / ghost text no editor (Onda 1.1, ADR 0014). Dispara a
  # cada pausa de digitação, então o que importa é latência de teclado, não
  # capacidade: um modelo de código de 70b a 2–4 s é inutilizável aqui.
  # `latency` ordena pelo p95 medido; a lista é o desempate e o fallback quando
  # o circuito abre. Configurável por IDE_COMPLETION_PROFILE.
  completion:
    strategy: latency
    models:
      - ollama/qwen2.5-coder:1.5b
      - groq/llama-3.1-8b-instant
      - ollama/qwen2.5-coder:7b

  # Predição do próximo edit ("tab to jump", Onda 1.2, ADR 0015). Dispara
  # depois de uma edição assentar — menos frequente que o autocompletar, então
  # pode usar um modelo mais capaz; mas ainda precisa responder em ~1 s, então
  # não é o `coding` de 70b puro. `latency` ordena pelo p95 medido; a lista é o
  # desempate e o fallback. Configurável por IDE_NEXT_EDIT_PROFILE.
  next-edit:
    strategy: latency
    models:
      - groq/llama-3.3-70b-versatile
      - databricks/llama-3.3-70b
      - anthropic/claude-haiku-4-5-20251001
      - ollama/qwen2.5-coder:7b

  # Trabalho auxiliar barato: mensagem de commit, título de PR, classificação,
  # sumarização de histórico.
  utility:
    strategy: priority
    models:
      - databricks/llama-3.3-70b
      - groq/llama-3.1-8b-instant
      - anthropic/claude-haiku-4-5-20251001
      - foundry/gpt-4o-mini
      - ollama/qwen2.5-coder:1.5b

  # A ordem aqui declara a preferência, não a compatibilidade: um modelo de
  # embedding só entra no pool se `embedding_dim` (providers.yaml) bater com
  # EMBEDDING_DIM. Com o padrão 768, o bge-large (1024) é desabilitado na carga
  # e este perfil resolve para o Ollama. Trocar de modelo aqui exige migrar as
  # colunas `Vector(...)` e reindexar — o espaço vetorial não é comparável.
  embedding:
    strategy: priority
    models:
      - databricks/bge-large-en
      - ollama/nomic-embed-text

# Resiliência aplicada a todos os perfis.
resilience:
  max_attempts: 3            # tentativas antes de desistir do request
  allowed_fails: 5           # falhas até abrir o circuito do provedor
  cooldown_seconds: 60       # cooldown base; cresce exponencialmente
  cooldown_max_seconds: 900
  request_timeout_seconds: 300
