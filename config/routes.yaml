# Perfis de roteamento. O cliente pede um perfil no campo `model`
# (ex.: "auto/cheap") ou um id concreto do providers.yaml (ex.: "foundry/gpt-4o").
#
# strategy:
#   priority     ordem literal da lista `models`
#   cost         menor custo estimado do request primeiro
#   latency      menor latência p95 observada primeiro
#   score        combinação ponderada (ver `weights`)
#
# `models` também aceita o fallback: quando o primeiro candidato falha ou o
# contexto não cabe na janela, o próximo assume.

default_profile: auto

profiles:
  # Padrão: pondera saúde, custo, latência e sucesso. Prefere local quando cabe.
  #
  # O modelo local aqui é o pequeno, de propósito. Sem GPU, o 7b só é
  # utilizável se o Docker tiver RAM sobrando — e o perfil `auto` é o que
  # responde quando ninguém escolheu nada, então ele não pode ser o que trava a
  # máquina. Para qualidade local explícita existe `local-first`.
  auto:
    strategy: score
    weights:
      health: 0.3
      cost: 0.25
      latency: 0.2
      success_rate: 0.15
      context_fit: 0.1
    models:
      - anthropic/claude-haiku-4-5-20251001
      - anthropic/claude-sonnet-4-6
      - groq/llama-3.3-70b-versatile
      - databricks/llama-3.3-70b
      - foundry/gpt-4o-mini
      - groq/llama-3.1-8b-instant
      - ollama/qwen2.5-coder:1.5b

  local-first:
    strategy: priority
    models:
      - ollama/qwen2.5-coder:7b
      - ollama/qwen2.5-coder:1.5b
      - anthropic/claude-haiku-4-5-20251001
      - databricks/llama-3.3-70b
      - foundry/gpt-4o-mini

  # Tarefas de codificação de verdade: qualidade primeiro.
  coding:
    strategy: priority
    models:
      - anthropic/claude-sonnet-4-6
      - groq/llama-3.3-70b-versatile
      - groq/deepseek-r1-distill-llama-70b
      - databricks/llama-3.3-70b
      - foundry/gpt-4o
      - ollama/qwen2.5-coder:7b

  cheap:
    strategy: cost
    models:
      - groq/llama-3.1-8b-instant
      - anthropic/claude-haiku-4-5-20251001
      - databricks/llama-3.3-70b
      - foundry/gpt-4o-mini
      - openai/gpt-4o-mini
      - ollama/qwen2.5-coder:1.5b

  fast:
    strategy: latency
    models:
      - groq/llama-3.1-8b-instant
      - groq/llama-3.3-70b-versatile
      - anthropic/claude-haiku-4-5-20251001
      - databricks/llama-3.3-70b
      - foundry/gpt-4o-mini
      - ollama/qwen2.5-coder:1.5b

  # Trabalho auxiliar barato: mensagem de commit, título de PR, classificação,
  # sumarização de histórico.
  utility:
    strategy: priority
    models:
      - groq/llama-3.1-8b-instant
      - anthropic/claude-haiku-4-5-20251001
      - databricks/llama-3.3-70b
      - foundry/gpt-4o-mini
      - ollama/qwen2.5-coder:1.5b

  embedding:
    strategy: priority
    models:
      - databricks/bge-large-en
      - ollama/nomic-embed-text

# Resiliência aplicada a todos os perfis.
resilience:
  max_attempts: 3            # tentativas antes de desistir do request
  allowed_fails: 5           # falhas até abrir o circuito do provedor
  cooldown_seconds: 60       # cooldown base; cresce exponencialmente
  cooldown_max_seconds: 900
  request_timeout_seconds: 300
