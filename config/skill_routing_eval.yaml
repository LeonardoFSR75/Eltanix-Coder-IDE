# Golden-set do roteamento automático de skills (Fase 1 do upgrade do agente).
#
# Cada linha é uma tarefa em linguagem natural e a skill que o roteador por
# similaridade (`AgentRunner._route_skills` -> `SkillService.find_relevant`)
# deveria trazer como melhor match (precision@1).
#
# Uso:
#   uv run python scripts/eval_skill_routing.py --profile <perfil-de-embedding>
# (precisa do Postgres com as skills seedadas + um provedor de embedding real —
# mesma categoria de teste "de integração" que `tests/test_hybrid_search.py`.)
#
# `tests/test_skill_routing.py::test_eval_dataset_is_well_formed` valida, sem
# provedor, que todo `expect` abaixo é o nome real de uma skill em `.agents/`.

cases:
  - task: "escreva testes unitários para o módulo de autenticação antes de implementar"
    expect: test-driven-development
  - task: "quero cobrir essa função com testes seguindo o ciclo red-green-refactor"
    expect: test-driven-development
  - task: "revise este pull request procurando bugs, acoplamento e falta de testes"
    expect: code-review-and-quality
  - task: "faça uma revisão de código crítica deste diff"
    expect: code-review-and-quality
  - task: "essa função está complexa demais, reduza a complexidade sem mudar o comportamento"
    expect: code-simplification
  - task: "simplifique este código mantendo a mesma saída"
    expect: code-simplification
  - task: "tem um bug intermitente no upload de arquivos, investigue a causa raiz"
    expect: debugging-and-error-recovery
  - task: "está lançando uma exceção em produção, ajude a rastrear e corrigir"
