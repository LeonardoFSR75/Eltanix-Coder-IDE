# Casos de avaliação de qualidade do RAG — `eltanix-eval-rag`
# (`eltanix/evals/runner.py`). Cada caso testa se a busca híbrida traz um
# trecho relevante dentro dos primeiros `limit` hits.
#
# COMO RODAR
# ----------
#   export ELTANIX_EVAL_ROOT=/caminho/para/seu/eltanix-coder-ide
#   # indexe o workspace uma vez (pela IDE ou por POST /api/context/index)
#   uv run eltanix-eval-rag --json /tmp/eval.json
#   uv run eltanix-eval-gate --report /tmp/eval.json
#
# `defaults.root` expande `${ELTANIX_EVAL_ROOT}`: ninguém precisa editar este
# arquivo para rodar em outra máquina, e o diff de um caso novo não vem
# poluído com o caminho absoluto de quem o escreveu.
#
# COMO ESCREVER UM CASO
# ---------------------
# `query` é o que uma pessoa digitaria — em português, do jeito torto que se
# pergunta de verdade, não o nome exato do símbolo. Se a query já contém o
# identificador esperado, o caso só exercita o ramo full-text e passa mesmo
# com o embedding fora do ar, que é justamente o que não se quer medir.
#
# `expected_keywords` é substring case-insensitive no conteúdo do chunk.
# Prefira identificador estável (classe, função, constante) a frase de
# comentário, que muda em qualquer revisão de texto.
#
# `tags` fatiam o relatório e o gate compara tag a tag: uma média única
# esconde que a recuperação quebrou só numa área.

defaults:
  source: context
  root: "${ELTANIX_EVAL_ROOT}"
  limit: 8

cases:
  # ── Roteamento de LLM ───────────────────────────────────────────────────
  - query: "onde o sistema decide qual modelo de linguagem vai atender o pedido"
