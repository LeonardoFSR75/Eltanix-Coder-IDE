[project]
name = "eltanix-api"
version = "0.1.0"
description = "Gateway multi-modelo e backend agêntico do Eltanix Coder IDE"
license = "Apache-2.0"
# Sem `readme`: apontar para ../../README.md quebra qualquer build em que só
# este diretório entra no contexto — o caso da imagem Docker. O pacote não é
# publicado, então não há o que perder.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "litellm>=1.98.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Cliente WS server-to-server: a API faz a ponte entre o WS do frontend e o
    # WS de screencast do services/browser (Fase 4a — streaming ao vivo).
    "websockets>=17.0",
    # Fase 2 — indexação do repositório
    "pgvector>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pathspec>=0.12",
    "watchfiles>=0.24",
    # Fase 3 — agente, sandbox e Git/GitHub
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    # O checkpointer do LangGraph fala psycopg, não asyncpg. Conviver com dois
    # drivers é o preço de não reimplementar persistência de grafo à mão.
    "psycopg[binary,pool]>=3.2",
    "docker>=7.1",
    "GitPython>=3.1",
    "ruamel-yaml>=0.18",
    # Fase de alinhamento — documentos (RAG) e blob storage
    "minio>=7.2",
    "pypdf>=5.0",
    "pdf-inspector>=1.14.0",
    "firecrawl-anydoc>=0.1.9",
    # MCP real — cliente para conectar servidores externos como ferramentas do agente
    "mcp>=2.0",
    "aiosqlite>=0.22.1",
    # Observabilidade — tracing e estatísticas para LLM e LangGraph
    "langfuse>=2.50.0",
    # QR do enrollment de 2FA (TOTP). Python puro, zero dependência nativa —
    # mesmo critério do resto: nada de wheel que exija toolchain no Windows.
    "segno>=1.6",
    # Cifra em repouso do segredo TOTP (F-7 da revisão de segurança 2026-08,
    # ver auth/secret_box.py). Ao contrário de bcrypt/argon2 (rejeitados no
    # ADR 0005), publica wheel abi3 pré-compilada para win_amd64/manylinux/
    # macOS — não exige toolchain, mesmo critério de psycopg[binary].
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19"]
# Integração opcional com o modelo real SecureBERT (ehsanaghaei/SecureBERT).
# Instalar com: uv sync --extra securebert
# Sem isto, o SecureBertService opera em modo heurístico (sem dependências extras).
securebert = [
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
]

[project.scripts]
eltanix-eval-rag = "eltanix.evals.runner:main"
eltanix-eval-gate = "eltanix.evals.gate:main"
eltanix-eval-judge = "eltanix.evals.judge:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Um teste que trava esperando rede ou banco roda por horas sem timeout.
    # Melhor falhar em 60s e mostrar onde travou.
    "pytest-timeout>=2.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eltanix"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# Comentários e docstrings do projeto são em português e usam pontuação
# tipográfica (travessão, aspas curvas) de propósito. RUF001-003 sinalizariam
# cada ocorrência como "caractere ambíguo".
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Carrega os apps `executor` e `browser` via importlib.util antes de importar os
# módulos de `eltanix`, então os imports do pacote ficam de propósito após código
# executável.
"tests/test_security_pentest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Nenhum teste desta suíte deveria levar 60s: os que tocam Git usam repositórios
# temporários, e os que tocam rede degradam em vez de esperar.
timeout = 60

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/eltanix"]
branch = true
omit = [
    "src/eltanix/*/__main__.py",
    "src/eltanix/evals/*",
]

[tool.coverage.report]
# `--cov-fail-under` no comando do CI é a porta; começa em 0 e sobe conforme
# a cobertura real for medida. Aqui só o que não conta como "faltando".
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
