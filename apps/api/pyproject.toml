[project]
name = "sicoobito-api"
version = "0.1.0"
description = "Gateway multi-modelo e backend agêntico do SicoobitoCode"
# Sem `readme`: apontar para ../../README.md quebra qualquer build em que só
# este diretório entra no contexto — o caso da imagem Docker. O pacote não é
# publicado, então não há o que perder.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Teto proposital: a partir da 1.92 o litellm passou a distribuir uma extensão
    # Rust e as versões estáveis não publicam wheel win_amd64 — instalar exigiria
    # MSVC Build Tools. A 1.91.x ainda é py3-none-any e roda em Windows e Linux.
    # Ao subir de versão, confira o wheel antes: https://pypi.org/pypi/litellm/json
    "litellm>=1.91.4,<1.92",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Fase 2 — indexação do repositório
    "pgvector>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pathspec>=0.12",
    "watchfiles>=0.24",
    # Fase 3 — agente, sandbox e Git/GitHub
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    # O checkpointer do LangGraph fala psycopg, não asyncpg. Conviver com dois
    # drivers é o preço de não reimplementar persistência de grafo à mão.
    "psycopg[binary,pool]>=3.2",
    "docker>=7.1",
    "GitPython>=3.1",
    "ruamel-yaml>=0.18",
    # Fase de alinhamento — documentos (RAG) e blob storage
    "minio>=7.2",
    "pypdf>=5.0",
    # MCP real — cliente para conectar servidores externos como ferramentas do agente
    "mcp>=2.0",
    "aiosqlite>=0.22.1",
    # Observabilidade — tracing e estatísticas para LLM e LangGraph
    "langfuse>=2.50.0",
    "securebert2 @ file:///C:/Users/leona/Documents/Projetos/SicoobitoCode/vendor/securebert2",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19"]

[project.scripts]
sicoobito-eval-rag = "sicoobito.evals.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Um teste que trava esperando rede ou banco roda por horas sem timeout.
    # Melhor falhar em 60s e mostrar onde travou.
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sicoobito"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# Comentários e docstrings do projeto são em português e usam pontuação
# tipográfica (travessão, aspas curvas) de propósito. RUF001-003 sinalizariam
# cada ocorrência como "caractere ambíguo".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Nenhum teste desta suíte deveria levar 60s: os que tocam Git usam repositórios
# temporários, e os que tocam rede degradam em vez de esperar.
timeout = 60

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
