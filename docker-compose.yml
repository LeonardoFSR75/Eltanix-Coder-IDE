name: sicoobito

# Toda a plataforma sobe junto. Faixa de portas 5400–5499 para não disputar
# 3000/8000/5432 com outros projetos — 5432 e 5489 já estavam ocupadas nesta
# máquina, então a numeração é sequencial a partir de 5400.
#
#   5400  web (Next.js)
#   5401  api (FastAPI)
#   5402  executor (interno; exposto só para diagnóstico)
#   5403  postgres
#   5404  redis
#   5405  ollama
#   5406  browser (só na rede interna — `browser_net` não permite publicar
#         porta para o host; diagnóstico via `docker exec`)
#
# Todas as portas publicadas são vinculadas a 127.0.0.1: nenhum destes
# serviços tem autenticação forte o suficiente para ficar alcançável pela
# rede (o executor tem acesso ao docker.sock, e o `web` reencaminha
# SICOOBITO_API_KEY automaticamente para quem alcançar a porta). Quem
# precisar de acesso pela LAN deve trocar por um binding explícito e reforçar
# a autenticação antes.
#
# Duas redes: a `default` (implícita, com saída para a internet — provedores
# de LLM, `docker pull`, etc.) e `browser_net` (`internal: true`, sem rota
# nenhuma para fora). O serviço `browser` só entra em `browser_net`: o
# Chromium que ele roda para a ferramenta de verificação visual do agente
# (browser_action) precisa de rede de verdade para alcançar `web`/`api`, mas
# não deve conseguir alcançar a internet pública nem qualquer outro serviço
# deste compose. `api` e `web` entram nas duas — continuam com acesso normal
# a postgres/redis/ollama/internet pela `default`, e adicionalmente
# alcançáveis pelo `browser` pela `browser_net`.

networks:
  default: {}
  browser_net:
    internal: true

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sicoobito
      POSTGRES_PASSWORD: sicoobito
      POSTGRES_DB: sicoobito
    ports:
      - "127.0.0.1:5403:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicoobito -d sicoobito"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:5404:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Inferência local. Vive no compose, não no host: é o que sustenta a promessa
  # de que a plataforma inteira sobe com um comando, e o que torna o perfil
  # `local-first` real em vez de decorativo.
  ollama:
    profiles:
      - ollama
    # Versão fixada: `latest` reinstala 4,7 GB a cada mudança de tag remota.
    image: ollama/ollama:${OLLAMA_VERSION:-0.31.2}
    ports:
      # Exposto para diagnóstico e para quem quiser apontar outra ferramenta.
      - "127.0.0.1:5405:11434"
    environment:
      # Manter o modelo carregado entre requisições. Sem GPU, o custo de subir os
      # pesos para a RAM domina a latência — descarregar a cada 5min (o padrão)
      # faz a primeira mensagem de toda sessão parecer travada.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Um modelo por vez: com 16 GB e sem GPU, dois residentes disputam RAM e
      # levam o sistema para o swap.
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      # Os pesos são o volume mais caro do projeto: sem persistência, cada
      # recriação do container rebaixa gigabytes.
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Baixa os modelos uma vez e sai. Roda separado do serviço para que a API não
  # fique bloqueada esperando gigabytes de download na primeira subida.
  ollama-init:
    profiles:
      - ollama
    # Versão fixada: `latest` reinstala 4,7 GB a cada mudança de tag remota.
    image: ollama/ollama:${OLLAMA_VERSION:-0.31.2}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for modelo in $${OLLAMA_PULL_MODELS}; do
          echo "== baixando $$modelo"
          ollama pull "$$modelo" || exit 1
        done
        echo "== modelos prontos"
        ollama list
    environment:
      # Cliente, não servidor: aponta para o serviço acima.
      OLLAMA_HOST: http://ollama:11434
      # Ordem importa: os pequenos primeiro, para que indexação e tarefas
      # utilitárias funcionem antes de o modelo de 4,7 GB terminar.
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-nomic-embed-text qwen2.5-coder:1.5b qwen2.5-coder:7b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Único serviço com acesso ao daemon do Docker. Fica isolado de propósito:
  # quem alcança o socket tem poder equivalente a root no host, então essa
  # capacidade não pode viver no mesmo processo que atende requisições de
  # usuário e executa código de modelo. Ver docs/adr/0002.
  executor:
    build:
      context: ./services/executor
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-executor-local}
      PROJECTS_ROOT_HOST: ${PROJECTS_ROOT:-./projetos}
      PROJECTS_ROOT_CONTAINER: /projects
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-2g}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-false}
    ports:
      - "127.0.0.1:5402:5402"
    volumes:
      # O socket é a razão de este serviço existir separado.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5402/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Roda o Chromium headless para `browser_action` (Fase 7). Isolado do
  # sandbox de execução de comando de propósito — ver o comentário na rede
  # `browser_net` acima e o docstring de `services/browser/app.py`.
  #
  # Sem `ports:` de propósito: `browser_net` é `internal: true`, e testado na
  # prática o publish de porta para o host não funciona numa rede sem rota
  # de saída (confirmado: `docker port` não lista nada, a porta simplesmente
  # não fica acessível de fora). Para diagnóstico, use
  # `docker exec sicoobito-browser-1 curl -s http://localhost:5406/health`.
  browser:
    build:
      context: ./services/browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-browser-local}
    networks:
      - browser_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5406/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks:
      - default
      - browser_net
    environment:
      DATABASE_URL: postgresql+asyncpg://sicoobito:sicoobito@postgres:5432/sicoobito
      REDIS_URL: redis://redis:6379/0
      SICOOBITO_API_KEY: ${SICOOBITO_API_KEY:?defina SICOOBITO_API_KEY no .env}
      # Raiz onde os projetos editáveis vivem, do ponto de vista do container.
      PROJECTS_ROOT: /projects
      # O mesmo caminho visto pelo host. O executor precisa dele para montar
      # volumes: o daemon do Docker resolve caminhos do host, não deste container.
      PROJECTS_ROOT_HOST: ${PROJECTS_ROOT:-./projetos}
      EXECUTOR_URL: http://executor:5402
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-executor-local}
      # Vazio (padrão) desliga a ferramenta de verificação visual; defina só
      # se o serviço `browser` estiver de pé (ele está, neste compose).
      BROWSER_URL: ${BROWSER_URL:-http://browser:5406}
      BROWSER_TOKEN: ${BROWSER_TOKEN:-browser-local}
      # O Ollama é um serviço do compose; `host.docker.internal` só entra se você
      # sobrescrever isto para usar uma instalação do host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:5401:5401"
    volumes:
      - ${PROJECTS_ROOT:-./projetos}:/projects
      # Sem `:ro`: a tela de Provedores grava perfis de roteamento (routes.yaml)
      # e credenciais (.env) direto do container — precisa poder escrever de volta.
      - ./config:/app/config
      - ./.env:/app/.env
      - ./apps/api/src:/app/src:ro
    extra_hosts:
      # Permite alcançar o Ollama rodando no host.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      executor:
        condition: service_started
      browser:
        condition: service_started

  web:
    build:
      context: ./apps/web
    networks:
      - default
      - browser_net
    environment:
      # O browser fala com o Next; o Next fala com a API pela rede interna.
      SICOOBITO_API_URL: http://api:5401
      SICOOBITO_API_KEY: ${SICOOBITO_API_KEY:?defina SICOOBITO_API_KEY no .env}
      # Usado só para montar a URL do WebSocket, que o browser abre direto.
      NEXT_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:5401}
      PORT: "5400"
      # Bind mount de Windows para container Linux não entrega eventos de
      # inotify: sem polling, o Next continua servindo o código antigo depois de
      # cada edição, e o sintoma é uma correção que "não fez efeito".
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5400:5400"
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  ollamadata:
