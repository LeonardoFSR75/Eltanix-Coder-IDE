name: sicoobito

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sicoobito
      POSTGRES_PASSWORD: sicoobito
      POSTGRES_DB: sicoobito
    # Portas deslocadas para não colidir com instâncias locais de Postgres/Redis.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicoobito -d sicoobito"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
