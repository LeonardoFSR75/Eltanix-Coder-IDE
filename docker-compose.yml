name: eltanix

# Toda a plataforma sobe junto. Faixa de portas 5400–5499 para não disputar
# 3000/8000/5432 com outros projetos — 5432 e 5489 já estavam ocupadas nesta
# máquina, então a numeração é sequencial a partir de 5400.
#
#   5400  web (Next.js)
#   5401  api (FastAPI)
#   5402  executor (interno; exposto só para diagnóstico)
#   5403  postgres
#   5404  redis
#   5405  ollama
#   5406  browser (só na rede interna — `browser_net` não permite publicar
#         porta para o host; diagnóstico via `docker exec`)
#   5410  mcp-scanner (Cisco AI Defense MCP Security Scanner)
#
# Todas as portas publicadas são vinculadas a 127.0.0.1: nenhum destes
# serviços tem autenticação forte o suficiente para ficar alcançável pela
# rede (o executor tem acesso ao docker.sock, e o `web` reencaminha
# ELTANIX_API_KEY automaticamente para quem alcançar a porta). Quem
# precisar de acesso pela LAN deve trocar por um binding explícito e reforçar
# a autenticação antes.
#
# Duas redes: a `default` (implícita, com saída para a internet — provedores
# de LLM, `docker pull`, etc.) e `browser_net` (`internal: true`, sem rota
# nenhuma para fora). O serviço `browser` só entra em `browser_net`: o
# Chromium que ele roda para a ferramenta de verificação visual do agente
# (browser_action) precisa de rede de verdade para alcançar `web`/`api`, mas
# não deve conseguir alcançar a internet pública nem qualquer outro serviço
# deste compose. `api` e `web` entram nas duas — continuam com acesso normal
# a postgres/redis/ollama/internet pela `default`, e adicionalmente
# alcançáveis pelo `browser` pela `browser_net`.

networks:
  default: {}
  browser_net:
    internal: true

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eltanix
      POSTGRES_PASSWORD: eltanix
      POSTGRES_DB: eltanix
    ports:
      - "127.0.0.1:5403:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eltanix -d eltanix"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:5404:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:5407:9000"
      - "127.0.0.1:5408:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Inferência local. Vive no compose, não no host: é o que sustenta a promessa
  # de que a plataforma inteira sobe com um comando, e o que torna o perfil
  # `local-first` real em vez de decorativo.
  ollama:
    profiles:
      - ollama
    # Versão fixada: `latest` reinstala 4,7 GB a cada mudança de tag remota.
    image: ollama/ollama:${OLLAMA_VERSION:-0.31.2}
    ports:
      # Exposto para diagnóstico e para quem quiser apontar outra ferramenta.
      - "127.0.0.1:5405:11434"
    environment:
      # Manter o modelo carregado entre requisições. Sem GPU, o custo de subir os
      # pesos para a RAM domina a latência — descarregar a cada 5min (o padrão)
      # faz a primeira mensagem de toda sessão parecer travada.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Um modelo por vez: com 16 GB e sem GPU, dois residentes disputam RAM e
      # levam o sistema para o swap.
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      # Os pesos são o volume mais caro do projeto: sem persistência, cada
      # recriação do container rebaixa gigabytes.
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Baixa os modelos uma vez e sai. Roda separado do serviço para que a API não
  # fique bloqueada esperando gigabytes de download na primeira subida.
  ollama-init:
    profiles:
      - ollama
    # Versão fixada: `latest` reinstala 4,7 GB a cada mudança de tag remota.
    image: ollama/ollama:${OLLAMA_VERSION:-0.31.2}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for modelo in $${OLLAMA_PULL_MODELS}; do
          echo "== baixando $$modelo"
          ollama pull "$$modelo" || exit 1
        done
        echo "== modelos prontos"
        ollama list
    environment:
      # Cliente, não servidor: aponta para o serviço acima.
      OLLAMA_HOST: http://ollama:11434
      # Ordem importa: os pequenos primeiro, para que indexação e tarefas
      # utilitárias funcionem antes de o modelo de 4,7 GB terminar.
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-nomic-embed-text qwen2.5-coder:1.5b qwen2.5-coder:7b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Único serviço com acesso ao daemon do Docker. Fica isolado de propósito:
  # quem alcança o socket tem poder equivalente a root no host, então essa
  # capacidade não pode viver no mesmo processo que atende requisições de
  # usuário e executa código de modelo. Ver docs/adr/0002.
  executor:
    build:
      context: ./services/executor
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-executor-local}
      PROJECTS_ROOT_HOST: ${PROJECTS_ROOT:-./projetos}
      PROJECTS_ROOT_CONTAINER: /projects
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-2g}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-false}
    ports:
      - "127.0.0.1:5402:5402"
    volumes:
      # O socket é a razão de este serviço existir separado.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5402/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Roda o Chromium headless para `browser_action` (Fase 7). Isolado do
  # sandbox de execução de comando de propósito — ver o comentário na rede
  # `browser_net` acima e o docstring de `services/browser/app.py`.
  #
  # Sem `ports:` de propósito: `browser_net` é `internal: true`, e testado na
  # prática o publish de porta para o host não funciona numa rede sem rota
  # de saída (confirmado: `docker port` não lista nada, a porta simplesmente
  # não fica acessível de fora). Para diagnóstico, use
  # `docker exec eltanix-browser-1 curl -s http://localhost:5406/health`.
  browser:
    build:
      context: ./services/browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-browser-local}
      HOST_GATEWAY_HOST: ${HOST_GATEWAY_HOST:-host.docker.internal}
      LIGHTPANDA_CDP_URL: ${LIGHTPANDA_CDP_URL:-http://lightpanda:9222}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - browser_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5406/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Lightpanda Browser: motor headless ultraleve em C/C++ (25MB RAM / 20ms startup)
  # para web scraping massivo, RAG crawling e inspeção rápida de DOM por agentes.
  lightpanda:
    image: ${LIGHTPANDA_IMAGE:-lightpanda/browser:latest}
    networks:
      - browser_net
    restart: unless-stopped
    healthcheck:
      disable: true

  mcp-scanner:
    build:
      context: ./services/mcp-scanner
    image: cisco-mcp-scanner:latest
    command: ["server"]
    networks:
      - default
    environment:
      MCP_SCANNER_API_KEY: ${CISCO_AI_DEFENSE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:5410:8000"
    volumes:
      - ./config:/workspace/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks:
      - default
      - browser_net
    environment:
      DATABASE_URL: postgresql+asyncpg://eltanix:eltanix@postgres:5432/eltanix
      REDIS_URL: redis://redis:6379/0
      ELTANIX_API_KEY: ${ELTANIX_API_KEY:-eltanix-local-dev-key}
      # Raiz onde os projetos editáveis vivem, do ponto de vista do container.
      PROJECTS_ROOT: /projects
      # O mesmo caminho visto pelo host. O executor precisa dele para montar
      # volumes: o daemon do Docker resolve caminhos do host, não deste container.
      PROJECTS_ROOT_HOST: ${PROJECTS_ROOT:-./projetos}
      EXECUTOR_URL: http://executor:5402
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-executor-local}
      # Vazio (padrão) desliga a ferramenta de verificação visual; defina só
      # se o serviço `browser` estiver de pé (ele está, neste compose).
      BROWSER_URL: ${BROWSER_URL:-http://browser:5406}
      BROWSER_TOKEN: ${BROWSER_TOKEN:-browser-local}
      # Cisco AI Defense MCP Security Scanner
      MCP_SCANNER_URL: ${MCP_SCANNER_URL:-http://mcp-scanner:8000}
      # O Ollama é um serviço do compose; `host.docker.internal` só entra se você
      # sobrescrever isto para usar uma instalação do host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # SecureBERT: ativação do modelo neural real HuggingFace (ehsanaghaei/SecureBERT)
      SECUREBERT_MODEL_ENABLED: ${SECUREBERT_MODEL_ENABLED:-true}
      HF_HOME: /root/.cache/huggingface
      # `minio:9000` só é alcançável de dentro do compose; URLs pré-assinadas
      # devolvidas ao browser precisam do endpoint publicado no host.
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:5407}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    # Sem `env_file: .env` aqui de propósito: o Compose só lê esse arquivo UMA
    # VEZ, na criação do container, e credencial de provedor OS-env sempre
    # ganha de valor de `.env` no pydantic-settings — mesmo vazia. Resultado:
    # qualquer chave salva pela tela de Provedores DEPOIS que o container já
    # existia (ex. Databricks) ficava permanentemente sombreada por um
    # snapshot vazio, e a tela mostrava "não configurado" para sempre, mesmo
    # com o `.env` correto em disco. `config.py::Settings` já lê `/app/.env`
    # direto (bind mount abaixo) a cada `Settings()` — é essa a única fonte
    # de verdade; os adaptadores de provedor (`router/adapters/*.py`) sempre
    # montam `api_key`/`api_base` explícito a partir de `Settings`, nunca
    # dependem do litellm pegar isso sozinho do ambiente.
    ports:
      - "127.0.0.1:5401:5401"
    volumes:
      - ${PROJECTS_ROOT:-./projetos}:/projects
      # Sem `:ro`: a tela de Provedores grava perfis de roteamento (routes.yaml)
      # e credenciais (.env) direto do container — precisa poder escrever de volta.
      - ./config:/app/config
      - ./.env:/app/.env
      - ./.agents:/app/.agents:ro
      - ./apps/api/src:/app/src:ro
      # Cache de modelos do HuggingFace (SecureBERT ~500 MB) persistido entre reinícios
      - hfcache:/root/.cache/huggingface
    extra_hosts:
      # Permite alcançar o Ollama rodando no host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # `/api/health/ready` sonda Postgres (obrigatório) + Redis (opcional).
      # A rota exige credencial (ADR 0005) — daí o header com a chave local.
      test:
        - "CMD"
        - "python"
        - "-c"
        - >-
          import os,urllib.request;
          urllib.request.urlopen(urllib.request.Request(
          'http://localhost:5401/api/health/ready',
          headers={'X-Api-Key': os.environ.get('ELTANIX_API_KEY','')}))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      executor:
        condition: service_started
      browser:
        condition: service_started
      mcp-scanner:
        condition: service_started

  web:
    build:
      context: ./apps/web
    networks:
      - default
      - browser_net
    environment:
      # O browser fala com o Next; o Next fala com a API pela rede interna.
      ELTANIX_API_URL: http://api:5401
      ELTANIX_API_KEY: ${ELTANIX_API_KEY:-eltanix-local-dev-key}
      # Usado só para montar a URL do WebSocket, que o browser abre direto.
      NEXT_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:5401}
      PORT: "5400"
      # Bind mount de Windows para container Linux não entrega eventos de
      # inotify: sem polling, o Next continua servindo o código antigo depois de
      # cada edição, e o sintoma é uma correção que "não fez efeito".
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5400:5400"
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
    depends_on:
      api:
        condition: service_healthy

  desktop:
    build:
      context: ./apps/desktop
    networks:
      - default
      - browser_net
    environment:
      VITE_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:5401}
      VITE_ELTANIX_API_KEY: ${ELTANIX_API_KEY:-eltanix-local-dev-key}
      ELTANIX_API_KEY: ${ELTANIX_API_KEY:-eltanix-local-dev-key}
      PORT: "5409"
    ports:
      - "127.0.0.1:5409:5409"
    volumes:
      - ./apps/desktop/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  ollamadata:
  miniodata:
  hfcache:

