# Atualizações de dependência automatizadas.
# Semanal, com agrupamento de minor/patch para não abrir uma PR por pacote.
# Ecossistemas: GitHub Actions (workflows), uv (apps/api), npm (apps/web).
# apps/desktop está em standby — reativar o bloco cargo/npm dele quando voltar.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
