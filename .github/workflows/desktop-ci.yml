name: Desktop CI (Svelte 5)

# `apps/desktop` está em standby (foco atual é a IDE web) — não faz sentido
# rodar um build Node/Tauri inteiro em todo PR. Este workflow só dispara
# quando o próprio pacote desktop muda, além do gatilho manual.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop (Svelte 5) — typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
