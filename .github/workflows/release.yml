name: Release Packaging

on:
  push:
    tags:
      - 'v*'

# Empacotar e publicar um release não deve ser interrompido no meio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Release Package
        run: |
          python scripts/pack_release.py --output eltanix_deploy.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: eltanix_deploy.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
