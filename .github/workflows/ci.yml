name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: API — lint & testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Instalar dependências
        run: uv sync --dev
      - name: ruff check
        run: uv run ruff check src
      - name: pytest
        run: uv run pytest tests -q

  web-build:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependências
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm run test
      - name: Build
        run: npm run build

  desktop-build:
    name: Desktop (Svelte 5) — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build


  api-db-tests:
    name: API — integração com Postgres (RRF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eltanix
          POSTGRES_PASSWORD: eltanix
          POSTGRES_DB: eltanix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eltanix -d eltanix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://eltanix:eltanix@localhost:5432/eltanix_test
      DATABASE_URL_TEST: postgresql+asyncpg://eltanix:eltanix@localhost:5432/eltanix_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Instalar dependências
        run: uv sync --dev
      - name: Migrar o banco de teste
        run: uv run alembic upgrade head
      - name: pytest (só os testes de hybrid_search)
        run: uv run pytest tests/test_hybrid_search.py -q

  db-migrations:
    name: API — migrações (drift & reversibilidade)
    runs-on: ubuntu-latest
    # Bloqueante: o drift model↔migração pré-existente foi zerado, então
    # qualquer novo desalinhamento (ou downgrade quebrado) deve travar o PR.
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eltanix
          POSTGRES_PASSWORD: eltanix
          POSTGRES_DB: eltanix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eltanix -d eltanix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://eltanix:eltanix@localhost:5432/eltanix_test
      DATABASE_URL_TEST: postgresql+asyncpg://eltanix:eltanix@localhost:5432/eltanix_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Instalar dependências
        run: uv sync --dev
      - name: upgrade head
        run: uv run alembic upgrade head
      - name: alembic check (autogenerate diff deve estar vazio)
        run: uv run alembic check
      - name: Reversibilidade — downgrade base -> upgrade head
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  dependency-audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: pip-audit (Python)
        working-directory: apps/api
        run: uv run --with pip-audit pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit (Node, falha em high/critical)
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
